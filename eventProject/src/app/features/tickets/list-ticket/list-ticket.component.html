<div class="container my-4">
  <!-- <h1 class="mb-4 text-center">{{ title }}</h1> -->
  <!-- Champ de recherche par ID -->
  <div class="mb-3">
    <input
      type="number"
      class="form-control"
      placeholder="Rechercher par ID"
      [(ngModel)]="searchId"
      autocomplete="off"
    />
  </div>
  <div class="table-responsive shadow rounded">
    <table class="table table-striped table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th>Id</th>
          <th>Price</th>
          <th>Event Id</th>
          <th>User Id</th>
          <th>Date</th>
          <th>Valid</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let t of tickets">
          <td>{{ t.id }}</td>
          <td>{{ t.price | currency }}</td>
          <td>{{ t.eventId }}</td>
          <td>{{ t.userId }}</td>
          <td>{{ t.date | date : "medium" }}</td>
          <td>{{ t.valid ? "Oui" : "Non" }}</td>
          <td>
            <button
              class="btn btn-success btn-sm"
              (click)="validerTicket(t)"
              [disabled]="t.valid"
            >
              Valider
            </button>
          </td>
          <td>{{ t.description }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
